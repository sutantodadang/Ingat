[package]
name = "ingat-core"
version = "0.1.6"
description = "Headless, Tauri-free core for the Ingat context memory system (domain, application services, storage and embedding adapters)."
authors = ["sutantodadang"]
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/sutantodadang/Ingat"

[lib]
name = "ingat_core"
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["serde", "v4"] }
thiserror = "1"
parking_lot = "0.12"
sha2 = "0.10"
ulid = "1"
ahash = "0.8"

# Optional integrations
schemars = { version = "1.1", features = ["derive", "chrono04"], optional = true }
bincode = { version = "1", optional = true }
sled = { version = "0.34", optional = true }
fastembed = { version = "5", default-features = false, features = [
    "hf-hub-native-tls",
    "ort-download-binaries",
], optional = true }

[dev-dependencies]
tempfile = "3"

[features]
default = ["sled-store"]
# Derive `schemars::JsonSchema` for wire DTOs (used by the MCP server).
schema = ["dep:schemars"]
# Legacy sled-backed storage adapter.
sled-store = ["dep:sled", "dep:bincode"]
# Reserved for the SQLite storage follow-up; intentionally dependency-free today.
sqlite-store = []
# Optional fastembed/ONNX embedding engine.
fastembed-engine = ["dep:fastembed"]
