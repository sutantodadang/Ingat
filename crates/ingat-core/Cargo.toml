[package]
name = "ingat-core"
version = "0.2.0"
description = "Headless, Tauri-free core for the Ingat context memory system (domain, application services, storage and embedding adapters)."
authors = ["sutantodadang"]
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/sutantodadang/Ingat"

[lib]
name = "ingat_core"
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["serde", "v4"] }
thiserror = "1"
parking_lot = "0.12"
sha2 = "0.10"
ulid = "1"
ahash = "0.8"

# Optional integrations
schemars = { version = "1.1", features = ["derive", "chrono04"], optional = true }
serde_json = { version = "1", optional = true }
bincode = { version = "1", optional = true }
sled = { version = "0.34", optional = true }
rusqlite = { version = "0.40.2", features = ["bundled"], optional = true }
fastembed = { version = "5", default-features = false, features = [
    "hf-hub-native-tls",
    "ort-download-binaries",
], optional = true }

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "ingat_export"
path = "src/bin/ingat_export.rs"
required-features = ["legacy-export"]

[[bin]]
name = "ingat_test_driver"
path = "src/bin/ingat_test_driver.rs"
required-features = ["sqlite-store"]

[features]
default = ["sled-store"]
# Derive `schemars::JsonSchema` for wire DTOs (used by the MCP server).
schema = ["dep:schemars"]
# Legacy sled-backed storage adapter.
sled-store = ["dep:sled", "dep:bincode"]
# Concurrent SQLite storage adapter (rusqlite bundled).
sqlite-store = ["dep:rusqlite", "dep:serde_json"]
# Offline `ingat_export` CLI for migrating a stopped Sled store to JSONL.
legacy-export = ["sled-store", "dep:serde_json"]
# Optional fastembed/ONNX embedding engine.
fastembed-engine = ["dep:fastembed"]
